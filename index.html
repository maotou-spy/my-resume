<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e1f" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Phuc Bui Huu - Fullstack Test Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Phuc, Bui Huu - Fullstack Test Engineer specializing in automation testing, QA, and API validation."
    />
    <meta property="og:image" content="https://phucbh.id.vn/og-image.png" />
    <meta property="og:url" content="https://phucbh.id.vn/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phuc Bui Huu - Fullstack Test Engineer" />
    <meta
      name="twitter:description"
      content="Portfolio of Phuc, Bui Huu - Fullstack Test Engineer specializing in automation testing, QA, and API validation."
    />
    <meta name="twitter:image" content="https://phucbh.id.vn/og-image.png" />

    <title>Phuc Bui Huu - Fullstack Test Engineer</title>
    <meta
      name="description"
      content="Portfolio of Phuc, Bui Huu - a Fullstack Test Engineer specializing in manual & automation testing, API validation, and quality assurance for large-scale systems."
    />
    <link rel="canonical" href="https://phucbh.id.vn/" />

    <!-- Set the theme before paint to avoid a light/dark flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'light') document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
